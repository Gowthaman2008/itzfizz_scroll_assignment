<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITZFIZZ | Scroll Hero</title>
    <meta
      name="description"
      content="ITZFIZZ scroll-driven hero section animation built with vanilla HTML, CSS and GSAP."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <header class="hero-section" id="hero">
      <div class="hero-glow"></div>

      <div class="hero-copy" id="copy">
        <h1 class="headline" id="headline" aria-label="Welcome ITZFIZZ"></h1>

        <div class="stats" aria-label="ITZFIZZ highlights">
          <div class="stat-item">
            <div class="stat-number">250<span class="accent">+</span></div>
            <div class="stat-label">PROJECTS</div>
          </div>
          <div class="stat-item">
            <div class="stat-number">50<span class="accent">+</span></div>
            <div class="stat-label">CLIENTS</div>
          </div>
          <div class="stat-item">
            <div class="stat-number">4.9</div>
            <div class="stat-label">RATING</div>
          </div>
        </div>
      </div>

      <div class="car-stage" aria-hidden="true">
        <div class="car-visual" id="carVisual">
          <div class="shadow"></div>
          <div class="car-body">
            <div class="car-window"></div>
            <div class="car-cabin"></div>
          </div>
          <div class="car-text">ITZ</div>
          <div class="headlight"></div>
          <div class="taillight"></div>
          <div class="wheel wheel-rear"><span class="spin"></span></div>
          <div class="wheel wheel-front"><span class="spin"></span></div>
        </div>
      </div>

      <div class="road"></div>
    </header>

    <main class="next-section">
      <div class="next-content">
        <h2>
          BUILT FOR <span class="accent">PERFORMANCE</span>
        </h2>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
